name: Publish site to GitHub Pages

# Copies the static site (store, finance records and the ad video) to the
# gh-pages branch, which GitHub Pages serves at https://koryofront.github.io/astra/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/ad
          cp -r index.html css js assets finance _site/
          cp finance/finance.html _site/finance/index.html
          cp ad/astra-ad/renders/astra-x1-pro-ad-60s.mp4 _site/ad/ 2>/dev/null || true
          touch _site/.nojekyll

      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
